<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SETUP English - Vocabulary Mastery Grade 12</title>
<style>
:root{
  --purple:#643D9F;
  --purple-dark:#4F2E80;
  --purple-soft:#F1EBF8;
  --yellow:#F8E974;
  --green:#46BC4E;
  --red:#E41D23;
  --ink:#241C2D;
  --muted:#7B7286;
  --line:#E9E3EF;
  --surface:#FFFFFF;
  --bg:#F7F5FA;
  --good:#198754;
  --bad:#B83A2F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:var(--ink);
  background:radial-gradient(circle at 10% 0%,rgba(100,61,159,.09),transparent 24rem),linear-gradient(180deg,#FAF9FC 0%,var(--bg) 100%);
}
button,input,select{font:inherit}
button{touch-action:manipulation}
.app{width:min(1060px,calc(100% - 28px));margin:0 auto;padding:22px 0 40px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  min-height:122px;padding:14px 22px;border-radius:24px;background:var(--purple);
  box-shadow:0 18px 45px rgba(79,46,128,.18);margin-bottom:16px;
}
.brand-logo{height:92px;max-width:min(420px,68vw);width:auto;display:block;object-fit:contain}
.bank-pill{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:40px;
  padding:9px 14px;border-radius:999px;color:#fff;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:900;white-space:nowrap
}
.card{background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(44,31,58,.07);padding:18px;margin-bottom:16px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:5px;border-radius:15px;background:#F3EFF7;margin-bottom:14px}
.tab{border:0;border-radius:11px;padding:12px 10px;background:transparent;color:#6D6177;font-weight:900;font-size:13px;cursor:pointer;transition:.16s ease}
.tab.active{background:#fff;color:var(--purple);box-shadow:0 5px 14px rgba(56,40,72,.08)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.select{display:flex;align-items:center;gap:8px;background:#F8F6FA;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.select label{font-size:12px;font-weight:900;color:#62576D}
.select select{border:0;background:transparent;min-width:90px;outline:none;font-weight:800;color:var(--purple-dark)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:42px;border:0;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:900;cursor:pointer;transition:.16s transform,.16s box-shadow,.16s opacity}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--purple);color:#fff;box-shadow:0 9px 18px rgba(100,61,159,.18)}
.btn.ghost{background:#F2EDF7;color:var(--purple)}
.btn.soft{background:#FAF8FD;color:#5E5368;border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.topic-chip{position:relative;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:.15s ease;min-height:52px}
.topic-chip:hover{border-color:#CFBFE2;box-shadow:0 8px 18px rgba(59,40,79,.05)}
.topic-chip input{position:absolute;opacity:0;pointer-events:none}
.topic-chip .dot{width:16px;height:16px;border:2px solid #B9A8D0;border-radius:50%;flex:0 0 auto;display:grid;place-items:center}
.topic-chip .dot::after{content:'';width:8px;height:8px;border-radius:50%;background:transparent;transition:.15s ease}
.topic-chip .name{font-size:13px;font-weight:800;color:#3B3148;line-height:1.35;flex:1}
.topic-chip .count{font-size:11px;font-weight:900;color:var(--muted);background:#F5F1FA;padding:5px 8px;border-radius:999px}
.topic-chip.active{border-color:#CDBBE2;background:#FBF9FE}
.topic-chip.active .dot{border-color:var(--purple)}
.topic-chip.active .dot::after{background:var(--purple)}
.hidden{display:none!important}
.session-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.meta{display:flex;gap:7px;flex-wrap:wrap}
.tag{padding:7px 10px;border-radius:999px;background:#F1EBF8;color:var(--purple);font-size:12px;font-weight:900}
.progress-wrap{height:9px;border-radius:999px;background:#EEEAF2;overflow:hidden;margin:14px 0 6px}
.progress{height:100%;width:0;background:linear-gradient(90deg,var(--purple),#8B65C2);transition:.25s}
.tiny{font-size:12px;color:var(--muted)}
.qtitle{font-size:30px;font-weight:900;line-height:1.25;margin:18px 0 8px;color:#30253C}
.qline{font-size:22px;line-height:1.45;font-weight:800;margin:12px 0 16px;color:#2A2233}
.clue{font-size:13px;font-weight:800;color:var(--muted);margin-top:-4px;margin-bottom:14px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.option{padding:15px 14px;border:1px solid #DDD6E5;background:#fff;border-radius:14px;text-align:left;cursor:pointer;font-weight:800;line-height:1.42;transition:.15s ease;min-height:54px;display:flex;align-items:center}
.option:hover{border-color:#A88CC7;box-shadow:0 6px 14px rgba(56,40,72,.05)}
.option.correct{border-color:#77C89D;background:#ECF8F1;color:#12613D}
.option.wrong{border-color:#E8A39B;background:#FDF0EE;color:#9B2F25}
.option.locked{pointer-events:none}
.input-row{display:flex;gap:10px;align-items:center}
.answer-input{flex:1;min-height:50px;padding:12px 14px;border:1px solid #D7CEE5;border-radius:12px;font-size:18px;outline:none}
.answer-input:focus{border-color:rgba(100,61,159,.65);box-shadow:0 0 0 4px rgba(100,61,159,.08)}
.feedback{margin-top:13px;padding:11px 13px;border-radius:11px;font-weight:850;font-size:14px}
.feedback.good{background:#EDF8F2;color:#16653F}
.feedback.bad{background:#FDF0EE;color:#9D342A}
.action-end{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.result-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.result h2{margin:0;font-size:28px}
.score-badge{display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;background:#F1EBF8;color:var(--purple);font-weight:900;font-size:13px}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:18px 0 16px}
.stat{background:#F8F6FA;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat strong{display:block;font-size:24px;color:var(--purple)}
.stat span{font-size:11px;color:var(--muted);font-weight:800}
.review-list{display:grid;gap:10px}
.review-item{border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff}
.review-item .no{font-size:11px;font-weight:900;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.review-item .rp{font-weight:800;line-height:1.5;margin-bottom:8px}
.review-meta{display:grid;gap:4px;font-size:13px}
.review-meta .right{color:var(--good);font-weight:900}
.review-meta .wrong{color:var(--bad);font-weight:900}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-weight:800}
.history-list{display:grid;gap:10px}
.history-item{border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff}
.history-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.history-mode{font-weight:900;color:var(--purple)}
.history-score{font-weight:900;color:#3A3047}
.history-sub{font-size:12px;color:var(--muted);line-height:1.5}

.typing-shell{display:grid;gap:12px}
.typing-hud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.typing-hud-left,.typing-hud-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.typing-stat{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;background:#F4F0F8;color:#5A4771;font-size:12px;font-weight:900}
.typing-hearts{font-size:21px;letter-spacing:2px;line-height:1}
.typing-arena{position:relative;height:390px;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#FBF9FE 0%,#F3EDF9 100%);box-shadow:inset 0 -45px 70px rgba(100,61,159,.04)}
.typing-arena::after{content:'';position:absolute;left:0;right:0;bottom:48px;height:2px;background:linear-gradient(90deg,transparent,#D5C4E8 10%,#D5C4E8 90%,transparent)}
.falling-word{position:absolute;top:12px;left:0;z-index:2;min-width:105px;max-width:31%;padding:11px 14px;border-radius:14px;background:#fff;border:1px solid #D9CCE8;box-shadow:0 12px 25px rgba(59,40,79,.12);font-size:19px;font-weight:900;color:var(--purple-dark);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition-property:transform,opacity;transition-timing-function:linear;will-change:transform}
.typing-entry{display:grid;grid-template-columns:1fr auto;gap:10px}
.typing-input{width:100%;min-height:52px;padding:12px 15px;border:1px solid #D7CEE5;border-radius:13px;background:#fff;color:var(--ink);font-size:19px;font-weight:800;outline:none}
.typing-input:focus{border-color:rgba(100,61,159,.65);box-shadow:0 0 0 4px rgba(100,61,159,.08)}
.typing-input.error{animation:typingShake .18s linear 2;border-color:#E5A39A;background:#FFF8F7}
.typing-flash{min-height:20px;text-align:center;font-size:13px;font-weight:900;color:var(--muted)}
.typing-flash.good{color:var(--good)}
.typing-flash.bad{color:var(--bad)}
.typing-missed{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.typing-missed span{padding:7px 9px;border-radius:999px;background:#FFF1EF;color:#9D342A;font-size:12px;font-weight:800}
@keyframes typingShake{0%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}100%{transform:translateX(0)}}
@media (max-width:900px){
  .tabs{grid-template-columns:repeat(2,1fr)}
  .topic-grid{grid-template-columns:1fr}
}
@media (max-width:720px){
  .app{width:min(100%,calc(100% - 18px));padding:14px 0 28px}
  .topbar{padding:12px 16px;min-height:116px;flex-direction:column;align-items:flex-start}
  .brand-logo{height:82px;max-width:82vw}
  .bank-pill{align-self:flex-end}
  .options,.statgrid{grid-template-columns:1fr}
  .session-head{grid-template-columns:1fr}
  .toolbar{align-items:stretch}
  .controls,.btnrow{width:100%}
  .btn.primary.start{flex:1}
  .qtitle{font-size:26px}
  .qline{font-size:20px}
  .input-row{flex-direction:column}
  .typing-entry{grid-template-columns:1fr}
  .typing-arena{height:330px}
  .answer-input,.input-row .btn{width:100%}
}

.type-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 14px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#FAF8FD}
.type-toggle{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:8px 12px;border:1px solid #DDD6E5;border-radius:11px;background:#fff;color:#5E5368;font-size:12px;font-weight:900;cursor:pointer}
.type-toggle input{position:absolute;opacity:0;pointer-events:none}
.type-toggle .mark{width:14px;height:14px;border-radius:4px;border:2px solid #B9A8D0;display:grid;place-items:center}
.type-toggle.active{border-color:#CDBBE2;background:#F4EFFA;color:var(--purple)}
.type-toggle.active .mark{border-color:var(--purple);background:var(--purple)}
.type-toggle.active .mark:after{content:'✓';color:#fff;font-size:10px;line-height:1}
.sentence-input{min-height:100px!important;resize:vertical;line-height:1.5}

</style>
</head>

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function sample(arr,n){if(n>=arr.length)return shuffle(arr);return shuffle(arr).slice(0,n)}
function norm(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[–—]/g,'-').replace(/[^a-z0-9\s\-/]/g,'').replace(/\s+/g,' ').trim()}
function primaryMeaning(item){return String(item.vi||'').split(/[;,]/)[0].trim()}
function posClass(pos){pos=String(pos||'').toLowerCase();if(pos.includes('adv'))return 'adv';if(pos.includes('adj'))return 'adj';if(pos.includes('v'))return 'verb';if(pos.includes('n'))return 'noun';return 'other';}

function distractors(pool,item,field,count=3,samePos=false){
  let base=pool.filter(x=>norm(x.en)!==norm(item.en) && norm(x[field])!==norm(item[field]));
  if(samePos){const same=base.filter(x=>posClass(x.pos)===posClass(item.pos));if(same.length>=count)base=same;}
  return uniqueOptions(sample(base.map(x=>x[field]), Math.min(count*3, base.length))).slice(0,count);
}
function optionWordsForWordClass(pool,item){
  const groups=['noun','verb','adj','adv'];
  const correctPos=posClass(item.pos);
  let opts=[item.en];
  for(const g of groups){
    if(g===correctPos)continue;
    const cands=shuffle(pool.filter(x=>norm(x.en)!==norm(item.en) && posClass(x.pos)===g));
    if(cands[0])opts.push(cands[0].en);
  }
  if(opts.length<4){
    const fallback=shuffle(pool.filter(x=>norm(x.en)!==norm(item.en) && !opts.some(o=>norm(o)===norm(x.en)))).slice(0,4-opts.length).map(x=>x.en);
    opts=opts.concat(fallback);
  }
  return shuffle(uniqueOptions(opts)).slice(0,4);
}

  });
}

  const p=posClass(item.pos);
  if(p==='noun'){
    if(containsAny(m,['người','nhà','bác sĩ','kẻ','viên','anh hùng'])) return `She hopes to become a ____ (${m}) in the future.`;
    if(containsAny(m,['thành tựu','cột mốc','kinh nghiệm','sự nghiệp','lòng','niềm','sự'])) return `This was an important ____ (${m}) in his life.`;
    if(containsAny(m,['quân đội'])) return `He joined the ____ (${m}) at a young age.`;
    return `The most suitable noun here is ____ (${m}).`;
  }
  if(p==='verb'){
    if(containsAny(m,['tham dự','theo học'])) return `Many students ____ (${m}) extra classes after school.`;
    if(containsAny(m,['đóng góp'])) return `Everyone should ____ (${m}) to the project.`;
    if(containsAny(m,['truyền cảm hứng'])) return `Great teachers often ____ (${m}) their students.`;
    if(containsAny(m,['vượt qua'])) return `She managed to ____ (${m}) her fear.`;
    if(containsAny(m,['công nhận'])) return `People soon ____ (${m}) his effort.`;
    return `In this context, the best verb is ____ (${m}).`;
  }
  if(p==='adj'){
    if(containsAny(m,['nổi tiếng'])) return `After the movie, the actor became ____ (${m}).`;
    if(containsAny(m,['dũng cảm'])) return `The firefighter was ____ (${m}) in the rescue.`;
    if(containsAny(m,['sáng tạo'])) return `The designer is very ____ (${m}).`;
    if(containsAny(m,['quyết tâm'])) return `She is ____ (${m}) to succeed.`;
    if(containsAny(m,['tham vọng'])) return `He is ____ (${m}) and wants to study abroad.`;
    return `The student seems very ____ (${m}).`;
  }
  if(p==='adv') return `He completed the task ____ (${m}).`;
  return `The best word for this blank is ____ (${m}).`;
}
function buildContextQuestions(pool,count){
  const questions=[];
  const used=new Set();
  const poolWords=new Set(pool.filter(isSimpleVocab).map(x=>norm(x.en)));
  let familyCandidates=[];
  if(selectedHasWordClassTopic()){
    familyCandidates=WORDCLASS_BANK;
  }else{
    familyCandidates=WORDCLASS_BANK.filter(x=>x.forms.some(f=>poolWords.has(norm(f))));
  }
  familyCandidates.forEach(x=>{
    const key=norm(x.answer+'|'+x.sentence);
    if(used.has(key))return;
    used.add(key);
    questions.push({kind:'input',mode:'context',prompt:'',subtitle:'WORD FORM',instruction:'Điền dạng từ đúng',sentence:`${x.sentence} (${x.cue})`,answer:x.answer,item:{en:x.answer,vi:''},reveal:`${x.answer} ← ${x.cue}`});
  });
  pool.filter(isSimpleVocab).forEach(item=>{
    const s=buildContextSentence(item);
    if(/The most suitable|In this context|The student seems very|The best word for this blank/.test(s))return;
    const clean=s.replace(/\s*\([^)]*\)/g,'');
    const key=norm(item.en+'|'+clean);
    if(used.has(key))return;
    used.add(key);
    questions.push({kind:'input',mode:'context',prompt:'',subtitle:item.pos.toUpperCase(),instruction:'Điền từ tiếng Anh đúng',sentence:clean,answer:item.en,item,reveal:`${item.en} = ${item.vi}`});
  });
  return sample(questions,Math.min(count,questions.length));
}
function buildSentenceQuestions(pool,count){
  const usable=pool.filter(isSimpleVocab);
  return sample(usable,Math.min(count,usable.length)).map(item=>({kind:'sentence',mode:'sentence',prompt:item.en,meaning:item.vi,instruction:'Đặt 1 câu với từ',answer:item.en,item,reveal:`${item.en} = ${item.vi}`}));
}
function buildWordClassQuestions(pool,count){
  const words=new Set(pool.filter(isSimpleVocab).map(x=>norm(x.en)));
  let usable=WORDCLASS_BANK.filter(x=>selectedHasWordClassTopic() || x.forms.some(f=>words.has(norm(f))));
  usable=sample(usable,Math.min(count,usable.length));
  return usable.map(x=>{
    let options=uniqueOptions(x.forms);
    if(options.length>4){
      const others=options.filter(o=>norm(o)!==norm(x.answer));
      options=[x.answer,...sample(others,3)];
    }
    return {kind:'mcq',mode:'wordclass',prompt:`${x.sentence} (${x.cue})`,subtitle:'',instruction:'Chọn dạng từ đúng',options:shuffle(options),answer:x.answer,item:{en:x.answer,vi:''},reveal:`${x.answer} ← ${x.cue}`};
  });
}
function buildMixedTestQuestions(pool,count){
  const types=getSelectedTestTypes();
  if(!types.length)return [];
  const base=Math.floor(count/types.length),rem=count%types.length;
  let all=[];
  types.forEach((type,i)=>{
    const n=base+(i<rem?1:0);
    if(type==='mcq') all=all.concat(buildTestQuestions(pool,n));
    if(type==='context') all=all.concat(buildContextQuestions(pool,n));
    if(type==='sentence') all=all.concat(buildSentenceQuestions(pool,n));
  });
  return shuffle(all).slice(0,count);
}
function createQuestions(mode,pool,count){
  if(mode==='learn')return buildLearnQuestions(pool,count);
  if(mode==='test')return buildMixedTestQuestions(pool,count);
  if(mode==='context')return buildContextQuestions(pool,count);
  if(mode==='sentence')return buildSentenceQuestions(pool,count);
  if(mode==='wordclass')return buildWordClassQuestions(pool,count);
  return [];
}

function quitSession(){if(confirm('Thoát phiên hiện tại?')){ stopTypingGame(); $('game').classList.add('hidden'); $('home').classList.remove('hidden'); }}


function getTypingPool(pool){
  return pool.filter(x=>x.en && x.en.length<=55 && !['family','pair','pattern'].includes(String(x.pos||'')));
}
function typingDuration(streak){
  return Math.max(4200,9000-Math.min(streak,24)*150);
}
function stopTypingGame(){
  const t=state.typing;
  if(!t)return;
  t.running=false;
  if(t.gameTimer)clearTimeout(t.gameTimer);
  if(t.clockRaf)cancelAnimationFrame(t.clockRaf);
  if(t.active){
    for(const obj of t.active.values()){
      if(obj.timer)clearTimeout(obj.timer);
    }
    t.active.clear();
  }
}
function startTypingSession(pool,topics){
  const typingPool=getTypingPool(pool);
  if(!typingPool.length){alert('Không có từ phù hợp cho Typing Game.');return;}
  const seconds=Math.max(10,+$('typingTime').value||60);
  state.pool=pool;
  state.selectedTopicIds=getSelectedTopicIds();
  state.sessionStarted=Date.now();
  state.typing={
    pool:typingPool,
    active:new Map(),
    nextId:1,
    hearts:3,
    streak:0,
    maxStreak:0,
    correct:0,
    missed:[],
    wrongTypes:0,
    running:true,
    durationMs:seconds*1000,
    endAt:performance.now()+seconds*1000,
    gameTimer:null,
    clockRaf:null
  };
  $('home').classList.add('hidden');
  $('result').classList.add('hidden');
  $('game').classList.remove('hidden');
  const topicText=topics.length===1?topics[0].name:`${topics.length} chủ điểm`;
  $('sessionMeta').innerHTML=`<span class="tag">Typing</span><span class="tag">${esc(topicText)}</span><span class="tag">${seconds}s</span>`;
  $('progress').style.width='0%';
  renderTypingArena();
}
function renderTypingArena(){
  const t=state.typing;
  $('gameBody').innerHTML=`
    <div class="typing-shell">
      <div class="typing-hud">
        <div class="typing-hud-left">
          <span class="typing-stat">TIME <strong id="typingTimeLeft">${Math.ceil(t.durationMs/1000)}</strong></span>
          <span class="typing-stat">TYPED <strong id="typingDone">0</strong></span>
          <span class="typing-stat">STREAK <strong id="typingStreak">0</strong></span>
          <span class="typing-stat">BEST <strong id="typingBest">0</strong></span>
        </div>
        <div class="typing-hearts" id="typingHearts">❤️ ❤️ ❤️</div>
      </div>
      <div class="typing-arena" id="typingArena"></div>
      <div class="typing-entry">
        <input id="typingInput" class="typing-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type any falling word" />
        <button class="btn primary" id="typingSubmit">Enter</button>
      </div>
      <div class="typing-flash" id="typingFlash"></div>
    </div>`;
  $('typingInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitTypingWord();});
  $('typingSubmit').onclick=submitTypingWord;
  $('typingInput').focus();
  maintainTypingWords();
  updateTypingHUD();
  t.gameTimer=setTimeout(()=>finishTypingGame('time'),t.durationMs);
  updateTypingClock();
}
function updateTypingClock(){
  const t=state.typing;if(!t||!t.running)return;
  const remain=Math.max(0,t.endAt-performance.now());
  const elapsed=t.durationMs-remain;
  const pct=Math.max(0,Math.min(100,elapsed/t.durationMs*100));
  $('progress').style.width=pct+'%';
  if($('typingTimeLeft'))$('typingTimeLeft').textContent=Math.ceil(remain/1000);
  $('progressText').textContent=`${Math.ceil(remain/1000)}s • ${t.correct} từ • Streak ${t.streak}`;
  if(remain<=0)return;
  t.clockRaf=requestAnimationFrame(updateTypingClock);
}
function updateTypingHUD(){
  const t=state.typing;if(!t)return;
  if($('typingStreak'))$('typingStreak').textContent=t.streak;
  if($('typingBest'))$('typingBest').textContent=t.maxStreak;
  if($('typingDone'))$('typingDone').textContent=t.correct;
  if($('typingHearts'))$('typingHearts').textContent='❤️ '.repeat(t.hearts)+'🖤 '.repeat(3-t.hearts);
}
function pickTypingItem(){
  const t=state.typing;
  const activeWords=new Set(Array.from(t.active.values()).map(x=>norm(x.item.en)));
  let choices=t.pool.filter(x=>!activeWords.has(norm(x.en)));
  if(!choices.length)choices=t.pool;
  return choices[Math.floor(Math.random()*choices.length)];
}
function maintainTypingWords(){
  const t=state.typing;if(!t||!t.running)return;
  while(t.active.size<2)spawnTypingWord();
}
function spawnTypingWord(){
  const t=state.typing;if(!t||!t.running)return;
  const arena=$('typingArena');if(!arena)return;
  const item=pickTypingItem();if(!item)return;
  const id=t.nextId++;
  const word=document.createElement('div');
  word.className='falling-word';
  word.dataset.id=String(id);
  word.textContent=item.en;
  arena.appendChild(word);
  const laneCount=2;
  const usedLanes=new Set(Array.from(t.active.values()).map(x=>x.lane));
  let lanes=[0,1].filter(x=>!usedLanes.has(x));
  if(!lanes.length)lanes=[0,1];
  const lane=lanes[Math.floor(Math.random()*lanes.length)];
  const laneWidth=Math.max(1,arena.clientWidth/laneCount);
  const wordWidth=Math.min(word.offsetWidth,arena.clientWidth*.78);
  const laneStart=lane*laneWidth;
  const maxX=Math.max(laneStart+6,Math.min(arena.clientWidth-wordWidth-8,laneStart+laneWidth-wordWidth-6));
  const minX=Math.min(maxX,laneStart+6);
  const x=minX+Math.random()*Math.max(1,maxX-minX);
  word.style.left=Math.max(6,x)+'px';
  word.style.transform='translateY(0px)';
  const base=typingDuration(t.streak);
  const duration=Math.round(base*(0.88+Math.random()*.24));
  const obj={id,item,el:word,timer:null,lane,duration};
  t.active.set(id,obj);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(!t.running||!t.active.has(id))return;
    const travel=Math.max(170,arena.clientHeight-word.offsetHeight-62);
    word.style.transitionDuration=duration+'ms';
    word.style.transform=`translateY(${travel}px)`;
  }));
  obj.timer=setTimeout(()=>typingWordMiss(id),duration+70);
}
function submitTypingWord(){
  const t=state.typing;if(!t||!t.running)return;
  const input=$('typingInput');
  const value=input.value.trim();if(!value)return;
  let matched=null;
  for(const obj of t.active.values()){
    if(norm(value)===norm(obj.item.en)){matched=obj;break;}
  }
  if(matched){
    clearTimeout(matched.timer);
    t.active.delete(matched.id);
    t.correct++;
    t.streak++;
    t.maxStreak=Math.max(t.maxStreak,t.streak);
    matched.el.style.transitionDuration='110ms';
    matched.el.style.opacity='0';
    matched.el.style.transform+=' scale(1.08)';
    setTimeout(()=>matched.el.remove(),120);
    input.value='';
    input.classList.remove('error');
    const flash=$('typingFlash');if(flash){flash.textContent='✓ '+matched.item.en;flash.className='typing-flash good';}
    updateTypingHUD();
    maintainTypingWords();
    input.focus();
  }else{
    t.wrongTypes++;
    t.streak=0;
    input.classList.remove('error');void input.offsetWidth;input.classList.add('error');input.select();
    const flash=$('typingFlash');if(flash){flash.textContent='Sai chính tả';flash.className='typing-flash bad';}
    updateTypingHUD();
  }
}
function typingWordMiss(id){
  const t=state.typing;if(!t||!t.running)return;
  const obj=t.active.get(id);if(!obj)return;
  t.active.delete(id);
  t.missed.push(obj.item);
  t.hearts--;
  t.streak=0;
  obj.el.remove();
  const flash=$('typingFlash');if(flash){flash.textContent=`Chậm • ${obj.item.en}`;flash.className='typing-flash bad';}
  updateTypingHUD();
  if(t.hearts<=0){finishTypingGame('hearts');return;}
  maintainTypingWords();
  const input=$('typingInput');if(input)input.focus();
}
function finishTypingGame(reason){
  const t=state.typing;if(!t||!t.running)return;
  const durationSec=Math.round(t.durationMs/1000);
  const completed=t.correct;
  const missedCount=t.missed.length;
  stopTypingGame();
  const record={time:Date.now(),mode:'typing',total:completed,correct:completed,score:completed,topics:getSelectedTopics().map(x=>x.name),maxStreak:t.maxStreak,duration:durationSec,missed:missedCount};
  const history=storageGet();history.unshift(record);storageSet(history);
  $('game').classList.add('hidden');$('home').classList.add('hidden');$('result').classList.remove('hidden');
  const missedUnique=[];const seen=new Set();for(const x of t.missed){if(!seen.has(norm(x.en))){seen.add(norm(x.en));missedUnique.push(x)}}
  const missedHTML=missedUnique.length?`<div class="typing-missed">${missedUnique.map(x=>`<span>${esc(x.en)} = ${esc(x.vi)}</span>`).join('')}</div>`:`<div class="empty">Không bỏ lỡ từ nào.</div>`;
  $('result').innerHTML=`
    <div class="result-head"><div><h2>${reason==='time'?'Time Up':'Game Over'}</h2></div><div class="score-badge">${completed} từ</div></div>
    <div class="statgrid">
      <div class="stat"><strong>${completed}</strong><span>Typed</span></div>
      <div class="stat"><strong>${t.maxStreak}</strong><span>Best streak</span></div>
      <div class="stat"><strong>${missedCount}</strong><span>Missed</span></div>
      <div class="stat"><strong>${t.wrongTypes}</strong><span>Typos</span></div>
    </div>
    ${missedHTML}
    <div class="action-end"><button class="btn primary" id="typingAgainBtn">Chơi lại</button><button class="btn ghost" id="typingHomeBtn">Đóng</button></div>`;
  $('typingAgainBtn').onclick=()=>{ $('result').classList.add('hidden');$('home').classList.remove('hidden');startSession(); };
  $('typingHomeBtn').onclick=()=>{ $('result').classList.add('hidden');$('home').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'}); };
  renderHistory();
}

function renderQuestion(){
  const q=state.questions[state.index];
  const pct=Math.round((state.index)/(state.questions.length)*100);
  $('progress').style.width=pct+'%';
  const correctSoFar=state.answers.filter(a=>a.correct).length;
  $('progressText').textContent=`${state.index+1} / ${state.questions.length} • Đúng ${correctSoFar}`;
  const body=[];

  if(q.mode==='learn'){
    body.push(`<div class="qtitle">${esc(q.prompt)} <button class="btn ghost" style="min-height:34px;padding:6px 10px;margin-left:8px" data-speak="1">🔊</button></div>`);
    body.push(`<div class="clue">${esc(q.instruction)} • ${esc(q.subtitle)}</div>`);
  } else if(q.mode==='context'){
    body.push(`<div class="qtitle">${esc(q.instruction)}</div>`);
    body.push(`<div class="clue">${esc(q.subtitle)}</div>`);
    body.push(`<div class="qline">${esc(q.sentence)}</div>`);
  } else if(q.mode==='sentence'){
    body.push(`<div class="qtitle">${esc(q.prompt)}</div>`);
    body.push(`<div class="clue">${esc(q.meaning)}</div>`);
  } else {
    body.push(`<div class="qtitle">${esc(q.instruction)}</div>`);
    body.push(`<div class="qline">${esc(q.prompt)}</div>`);
  }

  if(q.kind==='mcq'){
    body.push(`<div class="options">${q.options.map(opt=>`<button class="option" data-option="${esc(opt)}">${esc(opt)}</button>`).join('')}</div>`);
    body.push(`<div id="feedback"></div><div class="action-end"><button class="btn primary hidden" id="nextBtn">Câu tiếp</button></div>`);
  } else if(q.kind==='sentence'){
    body.push(`<div class="input-row"><textarea class="answer-input sentence-input" id="typedAnswer" autocomplete="off" placeholder="Write your sentence..."></textarea><button class="btn primary" id="submitBtn">Nộp</button></div>`);
    body.push(`<div id="feedback"></div><div class="action-end"><button class="btn primary hidden" id="nextBtn">Câu tiếp</button></div>`);
  } else {
    body.push(`<div class="input-row"><input class="answer-input" id="typedAnswer" autocomplete="off" placeholder="Type the word"><button class="btn primary" id="submitBtn">Nộp</button></div>`);
    body.push(`<div id="feedback"></div><div class="action-end"><button class="btn primary hidden" id="nextBtn">Câu tiếp</button></div>`);
  }
  $('gameBody').innerHTML=body.join('');
  const speakBtn=$('gameBody').querySelector('[data-speak]');
  if(speakBtn) speakBtn.onclick=()=>speak(q.prompt);
  if(q.kind==='mcq'){
    $('gameBody').querySelectorAll('.option').forEach(btn=>btn.onclick=()=>handleChoice(btn.dataset.option,btn));
  } else if(q.kind==='sentence'){
    $('submitBtn').onclick=()=>handleSentence();
    $('typedAnswer').focus();
  } else {
    $('submitBtn').onclick=()=>handleTyped();
    $('typedAnswer').addEventListener('keydown',e=>{if(e.key==='Enter')handleTyped();});
    $('typedAnswer').focus();
  }
  $('nextBtn').onclick=nextQuestion;
}

function recordAnswer(q,userAnswer,correct){state.answers.push({question:q,userAnswer,correct});}
function handleChoice(value,btnEl){
  const q=state.questions[state.index];
  if(q.mode==='learn'){
    const correct=norm(value)===norm(q.answer);
    recordAnswer(q,value,correct);
    $('gameBody').querySelectorAll('.option').forEach(btn=>{btn.classList.add('locked');if(norm(btn.dataset.option)===norm(q.answer))btn.classList.add('correct');if(btn===btnEl && !correct)btn.classList.add('wrong');});
    const box=$('feedback');
    box.className='feedback '+(correct?'good':'bad');
    box.textContent=q.reveal;
    $('nextBtn').classList.remove('hidden');
    return;
  }
  const correct=norm(value)===norm(q.answer);
  recordAnswer(q,value,correct);
  btnEl.classList.add(correct?'correct':'wrong');
  btnEl.closest('.options').querySelectorAll('.option').forEach(b=>b.classList.add('locked'));
  setTimeout(nextQuestion,180);
}
function handleTyped(){
  const q=state.questions[state.index];
  const input=$('typedAnswer');
  const value=input.value.trim();
  if(!value)return;
  const correct=norm(value)===norm(q.answer);
  recordAnswer(q,value,correct);
  const box=$('feedback');
  box.className='feedback '+(correct?'good':'bad');
  box.textContent = correct ? `Đúng • ${q.reveal}` : `Sai • ${q.reveal}`;
  input.disabled=true; $('submitBtn').disabled=true; $('nextBtn').classList.remove('hidden');
}
function handleSentence(){
  const q=state.questions[state.index];
  const input=$('typedAnswer');
  const value=input.value.trim();
  if(!value)return;
  const wordCount=value.split(/\s+/).filter(Boolean).length;
  const usesWord=norm(value).includes(norm(q.answer));
  const correct=usesWord && wordCount>=5;
  recordAnswer(q,value,correct);
  const box=$('feedback');
  box.className='feedback '+(correct?'good':'bad');
  box.textContent=correct?'Đã ghi nhận.':'Câu cần có từ đã cho và ít nhất 5 từ.';
  input.disabled=true;$('submitBtn').disabled=true;$('nextBtn').classList.remove('hidden');
}

function nextQuestion(){
  state.index++;
  if(state.index>=state.questions.length){finishSession();return;}
  renderQuestion();
}

function finishSession(){
  const total=state.answers.length;
  const correct=state.answers.filter(a=>a.correct).length;
  const wrongItems=state.answers.filter(a=>!a.correct);
  const topics=getSelectedTopics();
  const record={time:Date.now(),mode:state.mode,total,correct,score:formatPct(correct,total),topics:topics.map(t=>t.name)};
  const history=storageGet(); history.unshift(record); storageSet(history);
  $('game').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('home').classList.add('hidden');
  const review=wrongItems.length ? `<div class="review-list">${wrongItems.map((a,i)=>`<div class="review-item"><div class="no">Sai câu ${i+1}</div><div class="rp">${reviewPrompt(a.question)}</div><div class="review-meta"><div class="wrong">Bạn chọn / nhập: ${esc(a.userAnswer||'—')}</div><div class="right">Đáp án đúng: ${esc(a.question.answer)}</div><div>${esc(a.question.reveal)}</div></div></div>`).join('')}</div>` : `<div class="empty">Không có câu sai.</div>`;
  $('result').innerHTML=`
    <div class="result-head">
      <div><h2>${MODES[state.mode].label}</h2></div>
      <div class="score-badge">${correct} / ${total} • ${formatPct(correct,total)}%</div>
    </div>
    <div class="statgrid">
      <div class="stat"><strong>${total}</strong><span>Tổng câu</span></div>
      <div class="stat"><strong>${correct}</strong><span>Đúng</span></div>
      <div class="stat"><strong>${total-correct}</strong><span>Sai</span></div>
      <div class="stat"><strong>${Math.max(1,getSelectedTopics().length)}</strong><span>Chủ điểm</span></div>
    </div>
    ${review}
    <div class="action-end"><button class="btn ghost" id="backHomeBtn">Đóng</button></div>
  `;
  $('backHomeBtn').onclick=()=>{ $('result').classList.add('hidden'); $('home').classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'}); };
  renderHistory();
}
function reviewPrompt(q){
  if(q.mode==='context')return q.sentence;
  if(q.mode==='sentence')return `${q.prompt} — ${q.meaning}`;
  return q.prompt;
}

function renderHistory(){
  const data=storageGet();
  if(!data.length){$('historyPane').innerHTML='<div class="empty">Chưa có lịch sử.</div>';return;}
  $('historyPane').innerHTML=`<div class="history-list">${data.map(row=>{const scoreText=row.mode==='typing'?`${row.correct} từ • ${row.duration||60}s${row.maxStreak!=null?` • Streak ${row.maxStreak}`:''}`:`${row.correct} / ${row.total} • ${row.score}%`;return `<div class="history-item"><div class="history-top"><div class="history-mode">${esc(MODES[row.mode]?.label||row.mode)}</div><div class="history-score">${scoreText}</div></div><div class="history-sub">${esc(formatDate(row.time))} • ${esc((row.topics||[]).slice(0,3).join(' | '))}${(row.topics||[]).length>3?' ...':''}</div></div>`;}).join('')}</div>`;
}

function bind(){
  document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>setMode(btn.dataset.mode)));
  document.querySelectorAll('.test-type').forEach(cb=>cb.addEventListener('change',()=>cb.parentElement.classList.toggle('active',cb.checked)));
  $('selectAllBtn').onclick=()=>{document.querySelectorAll('.topic-check').forEach(cb=>{cb.checked=true;cb.parentElement.classList.add('active')})};
  $('clearAllBtn').onclick=()=>{document.querySelectorAll('.topic-check').forEach(cb=>{cb.checked=false;cb.parentElement.classList.remove('active')})};
  $('startBtn').onclick=startSession;
  $('quitBtn').onclick=quitSession;
}
function init(){
  $('bankCount').textContent=`${TOPICS.reduce((n,t)=>n+t.items.length,0).toLocaleString()} từ • ${TOPICS.length} chủ điểm`;
  buildTopicGrid();
  bind();
  setMode('learn');
}
init();
</script>
</body>
</html>
